<!DOCTYPE html>
<html>
<body>

    <p id="reel"></p>
<script>
let reel =10;

if (reel >= 20 && reel <= 30) {
    document.getElementById("reel").innerText = "Le reel est compris entre 20 et 30";
} else {
    document.getElementById("reel").innerText = "Le reel est en dehors de l'intervalle [20, 30]";
}




</script>

</body>
</html>
