<!DOCTYPE html>
<html>
<body>
<p id="nombre"></p>
<script>
let nombre = "4";
if (nombre >= 1 && nombre <= 5) {
switch (nombre) {
    case "1":
        document.getElementById("nombre").innerText = "un";
        break;
    case "2":
        document.getElementById("nombre").innerText = "deux";
        break;
        case "3":
        document.getElementById("nombre").innerText = "trois";
        break;
        case "4":
        document.getElementById("nombre").innerText = "quatre";
        break;
        case "5":
        document.getElementById("nombre").innerText = "cinq";
        break;
    default:
        document.getElementById("nombre").innerText = "Nombre hors intervalle";
}
}


</script>

</body>
</html>
