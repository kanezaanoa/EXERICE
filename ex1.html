<!DOCTYPE html>
<html>
<body>

    <p id="nombre"></p>
<script>
let nombre = 20;

if (nombre <25) {
    document.getElementById("nombre").innerText = "Inférieur à 25";
} else {
    document.getElementById("nombre").innerText = "Supérieur à 25";
}
if (nombre ===25) {
    document.getElementById("nombre").innerText = "Égal à 25";

}



</script>

</body>
</html>
